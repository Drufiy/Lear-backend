apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lear-demo
  labels:
    app: postgres
    team: lear-demo
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        team: lear-demo
        env: staging
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: "demo"
            - name: POSTGRES_DB
              value: "checkout"
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lear-demo
  labels:
    app: postgres
    team: lear-demo
    env: staging
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
