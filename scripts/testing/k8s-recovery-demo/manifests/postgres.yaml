apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lear-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_PASSWORD, value: "demo" }
            - { name: POSTGRES_DB, value: "checkout" }
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lear-demo
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
