apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: lear-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout-api }
  template:
    metadata:
      labels: { app: checkout-api }
    spec:
      containers:
        - name: checkout-api
          image: checkout-api:demo
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: checkout-api-config }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: lear-demo
spec:
  selector: { app: checkout-api }
  ports:
    - port: 80
      targetPort: 8080
