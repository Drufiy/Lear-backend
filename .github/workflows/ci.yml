name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both matter: Aryan develops on Windows, Aradhya on macOS, and Prash v2
    # is a CLI tool — path handling and shell behaviour differ between them.
    # Catching that here is cheaper than catching it when one of you can't
    # run the other's code.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        # Written before pyproject.toml existed (repo was docs-only scaffolding
        # at the time) -- this originally only handled requirements.txt, so it
        # never actually installed the `prash` package itself. Once real code
        # landed with imports like `from prash.actions...`, every test failed
        # with ModuleNotFoundError: No module named 'prash'. `pip install -e .`
        # is what was missing. Keep the requirements.txt fallback too, in case
        # anyone adds one instead of extending pyproject.toml later.
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff

      - name: Lint
        shell: bash
        run: ruff check . || echo "::warning::ruff reported issues (not failing the build yet)"

      - name: Tests
        shell: bash
        # Exit code 5 = "no tests collected", which is fine while the repo is
        # still being scaffolded. Any real test failure still fails the build.
        #
        # `set +e` is required: GitHub runs this step under `bash -e`, which
        # aborts on the first non-zero exit — so without it, pytest's exit 5
        # kills the script before the check below can run.
        run: |
          set +e
          pytest -q
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "No tests collected yet — passing."
            exit 0
          fi
          exit "$code"

  # §6's Track B sub-task that was missed when the connector itself shipped:
  # "GitHub Actions cannot reach your cluster, so action tests won't run in
  # CI unless you give them somewhere to run. Use kind." tests/test_kubernetes_
  # connector.py (the job above) is fully mocked and thorough on classification
  # logic, but can't catch real API-server/auth/response-shape issues -- this
  # is that other half. Linux only: GitHub's macOS runners don't support the
  # nested virtualization Docker needs, and kind-on-Windows is unreliable
  # enough in Actions to not be worth chasing for this sprint. Additive to
  # the 3-OS job above, not a replacement.
  k8s-live-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Deploy the broken-pod fixture
        # DELIBERATE, TEMPORARY breakage (failure #2 of 2, unrelated cause to
        # the pytest failure in the `test` job) for a live test of
        # `prash fix --ci`. See tests/test_deliberate_ci_failure_fixture.py.
        run: kubectl apply -f prash/connectors/testdata/this-path-does-not-exist.yaml

      - name: Wait for real CrashLoopBackOff
        # Manually verified during development to land in ~15-30s (PRASH_V2.md
        # §10, 2026-08-09) -- polling with margin rather than a blind sleep,
        # since CI scheduling latency isn't the same as a local machine's.
        run: |
          for i in $(seq 1 30); do
            reason=$(kubectl get pod -n prash-demo -l app=broken-app \
              -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || true)
            if [ "$reason" = "CrashLoopBackOff" ]; then
              echo "Reached CrashLoopBackOff (attempt $i of 30)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pod never reached CrashLoopBackOff within 300s"
          kubectl get pods -n prash-demo -o wide
          kubectl describe pod -n prash-demo -l app=broken-app
          exit 1

      - name: Live connector tests
        env:
          PRASH_LIVE_K8S_TESTS: "1"
        run: pytest tests/test_kubernetes_connector_live.py -v
