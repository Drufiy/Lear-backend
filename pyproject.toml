[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prash-v2"
version = "0.2.0"
description = "Prash v2 - local-first AI DevOps agent"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "kubernetes>=29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
prash = "prash.cli:main"

[tool.setuptools.packages.find]
include = ["prash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
