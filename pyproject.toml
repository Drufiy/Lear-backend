[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prash-v2"
version = "0.2.0"
description = "Prash v2 - local-first AI DevOps agent"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "kubernetes>=29.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "openai>=1.0",
    "plyer>=2.1",
    "textual>=8.0",
    # plyer's macOS notification backend needs pyobjus (a PyObjC-style bridge)
    # that isn't pulled in automatically -- without it, notify() raises and
    # _notify() falls back to console-only, which is silent-but-safe, not a
    # crash, but it means real desktop notifications never actually fire on
    # macOS. Found live, verifying the watcher against the actual cluster.
    "pyobjus>=1.2.3; sys_platform == 'darwin'",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
prash = "prash.cli:main"

[tool.setuptools.packages.find]
include = ["prash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
